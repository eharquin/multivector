name: Bug report
description: Report reproducible incorrect behavior in MultiVector
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve MultiVector. Do not report security vulnerabilities or private conduct concerns here.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong, and what did you expect instead?
      placeholder: A concise description of the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest complete sequence that reproduces the problem.
      placeholder: |
        1. Open MultiVector
        2. Enter ...
        3. Select ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expressions
    attributes:
      label: Expressions or document
      description: Include the complete relevant expressions or a minimal canonical document. Remove private data.
      render: text

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: For mathematical issues, include the expected result and convention or reference used.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include diagnostics, screenshots, or console output when useful.
    validations:
      required: true

  - type: input
    id: algebra
    attributes:
      label: Algebra and dimension
      description: For example, VGA(2). Write "Not applicable" for non-mathematical issues.
      placeholder: VGA(2)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, operating system, and deployed site or source revision.
      placeholder: Firefox 128, Ubuntu 24.04, commit abc1234
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no credentials, personal data, or private vulnerability details.
          required: true
